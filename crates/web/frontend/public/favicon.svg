<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfaf3"/>
      <stop offset="100%" stop-color="#efe7d5"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#d6cdb6" stroke-width="1"/>
  <!-- a step/play arrow that suggests "advance" + a trailing dot for a breakpoint -->
  <path
    d="M 22 18 L 22 46 L 44 32 Z"
    fill="url(#fg)"
    stroke="#065f46"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
  <circle cx="14" cy="32" r="3.4" fill="#dc2626" stroke="#fdfaf3" stroke-width="1.2"/>
  <!-- soft chevron dots beneath the arrow as a quiet debug-step signature -->
  <circle cx="48" cy="48" r="1.6" fill="#047857" opacity="0.55"/>
  <circle cx="52.5" cy="48" r="1.6" fill="#047857" opacity="0.35"/>
  <circle cx="57" cy="48" r="1.6" fill="#047857" opacity="0.18"/>
</svg>
