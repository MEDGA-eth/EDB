[package]
name = "edb-integration-tests"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

description = "Integration tests for EDB components"

[lints]
workspace = true

[dependencies]
# EDB internal crates
edb-common.workspace = true
edb-rpc-proxy.workspace = true
edb-engine.workspace = true
# The `edb` binary crate also ships a small library facade used by the
# integration tests (see `crates/edb/src/cmd/test/harness.rs`).
edb = { path = "../edb", features = ["test-harness"] }

# Test dependencies
tokio = { workspace = true, features = ["full"] }
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
chrono = { workspace = true, features = ["serde"] }
eyre.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
reqwest = { workspace = true, features = ["json"] }
once_cell.workspace = true
futures.workspace = true

# Alloy for blockchain types
alloy-primitives = { workspace = true, features = ["getrandom", "rand"] }
alloy-rpc-types = { workspace = true, features = ["eth"] }
alloy-json-abi = { workspace = true }
alloy-dyn-abi = { workspace = true }

# REVM for hardfork specs
revm = { workspace = true, features = ["std", "serde"] }

[dev-dependencies]
# Serializes integration tests that mutate process-global state
# (FOUNDRY_PROFILE, current directory, etc.) — see foundry_test_fixture.rs.
serial_test = "3"
